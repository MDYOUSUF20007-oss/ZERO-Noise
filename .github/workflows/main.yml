name: Zero-Noise — Web, Pages & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── JOB 1: Test & Build Web App ──────────────────────────────────────────
  build-web:
    name: Test & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify Core Productivity Integrity (Anti-Cheat Gate)
        run: node scripts/verify-integrity.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests (20h Rollover & Anti-Exploit)
        run: npm test

      - name: Lint Web & Integrity Modules
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-web-dist
          path: dist/
          retention-days: 14

  # ─── JOB 2: Deploy Live Site to GitHub Pages ──────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── JOB 3: Build Signed Update-Compatible Android Release APKs ───────────
  build-android-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    env:
      ZERO_VERSION_NAME: 1.0.${{ github.run_number }}
      EXPECTED_CERT_SHA256: A1:4A:36:1E:D4:B7:F7:D6:6E:57:69:92:99:9D:02:8A:05:32:65:85:0A:6C:A4:AF:EE:4F:C1:2F:29:48:CE:11

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify Core Productivity Integrity (Anti-Cheat Gate)
        run: node scripts/verify-integrity.mjs

      - name: Compute Monotonic Android Version Code
        run: |
          echo "ZERO_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Grant Executable Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: Decode Persistent Release Signing Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZERO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ZERO_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ZERO_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/zero-release.p12"
            keytool -list -v -storetype PKCS12 \
              -keystore "${{ runner.temp }}/zero-release.p12" \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" | grep -E "Alias name:|SHA256:"
            echo "custom_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "Using repository master keystore (zero-release.jks)"
            echo "custom_keystore=false" >> "$GITHUB_OUTPUT"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run Android Unit Tests (Standard & Strict)
        run: |
          cd android
          set -o pipefail
          if ! ./gradlew testStandardReleaseUnitTest testStrictReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log; then
            echo "### Android Unit Test / Compile Failure Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 gradle-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|e: |FAILED|AssertionError|Exception|What went wrong" gradle-test.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
            exit 1
          fi

      - name: Compile Signed Release APKs (v${{ env.ZERO_VERSION_NAME }} / code ${{ env.ZERO_VERSION_CODE }})
        if: steps.keystore.outputs.signed == 'true'
        env:
          ZERO_KEYSTORE_PATH: ${{ steps.keystore.outputs.custom_keystore == 'true' && format('{0}/zero-release.p12', runner.temp) || '' }}
          ZERO_KEYSTORE_TYPE: PKCS12
          ZERO_KEYSTORE_PASS: ${{ secrets.ZERO_KEYSTORE_PASS }}
          ZERO_KEYSTORE_KEY_PASS: ${{ secrets.ZERO_KEYSTORE_KEY_PASS }}
          ZERO_KEYSTORE_ALIAS: ${{ secrets.ZERO_KEYSTORE_ALIAS }}
        run: |
          cd android
          set -o pipefail
          if ! ./gradlew assembleStandardRelease assembleStrictRelease --no-daemon --stacktrace 2>&1 | tee gradle-release.log; then
            echo "### Android Release APK Compile Failure Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 gradle-release.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "Missing class|ERROR:|error:|e: |FAILURE:|Caused by:|What went wrong" gradle-release.log | head -n 30 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
            exit 1
          fi

      - name: Compile Preview Test APKs (Debug-Signed Fallback)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          cd android
          ./gradlew assembleStandardDebug assembleStrictDebug --no-daemon --stacktrace
          rm -rf ../release-assets && mkdir -p ../release-assets
          cp app/build/outputs/apk/strict/debug/app-strict-debug.apk "../release-assets/ZERO-requires-adb-v${ZERO_VERSION_NAME}-preview.apk"
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk "../release-assets/ZERO-v${ZERO_VERSION_NAME}-preview.apk"
          (cd ../release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat ../release-assets/SHA256SUMS.txt

      - name: Verify APK Signing Certificate & Stage Release Assets
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          chmod +x "$APKSIGNER" || true

          rm -rf release-assets && mkdir -p release-assets
          cp android/app/build/outputs/apk/strict/release/app-strict-release.apk "release-assets/ZERO-requires-adb-v${ZERO_VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "release-assets/ZERO-v${ZERO_VERSION_NAME}.apk"

          apk_count=$(ls -1 release-assets/*.apk 2>/dev/null | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No release APKs found in release-assets/ to verify"
            exit 1
          fi

          EXPECTED_CLEAN=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          for apk in release-assets/*.apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify --print-certs "$apk"
            CERT_HEX=$("$APKSIGNER" verify --print-certs "$apk" | grep "SHA-256 digest" | head -n1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
            if [ "$CERT_HEX" != "$EXPECTED_CLEAN" ]; then
              echo "::error::Certificate mismatch for $apk! Expected $EXPECTED_CLEAN got $CERT_HEX"
              exit 1
            fi
          done

          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Upload Strict Accessibility APK Artifact (Full Zero Mode)
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-requires-adb-apk
          path: release-assets/ZERO-requires-adb-v${{ env.ZERO_VERSION_NAME }}*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standard Sideload APK Artifact (Usage Access + Overlay)
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-apk
          path: release-assets/ZERO-v${{ env.ZERO_VERSION_NAME }}*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download GitHub Release (Signed)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ZERO_VERSION_NAME }}
          name: Zero-Noise v${{ env.ZERO_VERSION_NAME }} (code ${{ env.ZERO_VERSION_CODE }})
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          body: |
            ### Zero-Noise (Zero App) v${{ env.ZERO_VERSION_NAME }} (`versionCode ${{ env.ZERO_VERSION_CODE }}`)

            > **Google Play Protect Note ("App scan recommended — Play Protect hasn't seen this app before"):**
            > This standard Android prompt appears whenever you install a newly compiled APK directly from GitHub instead of the Google Play Store. Because each release binary has a fresh SHA-256 hash not yet indexed in Play Protect's cloud, Android asks to scan it once before installing — it does **not** mean Zero is unsafe.
            > Tap **Scan app** (or verify your download against `SHA256SUMS.txt` and release key `A1:4A:36:...CE:11`) to clear the check cleanly and proceed with the update.

            **Seamless In-Place Updates (V1 + V2 + V3 Signed):** Every official release (`v1.0.19+`) shares Zero App's permanent certificate (`SHA-256: ${{ env.EXPECTED_CERT_SHA256 }}`), now with explicit **V1 + V2 + V3 APK signing** for broad Android OEM file-manager compatibility.
            *(Troubleshooting if an older `v1.0.18-preview` or earlier debug build fails to update with "App not installed": open **Settings & OS → OS → Installed Build & Update Key** to confirm whether your phone is on the old debug key `0D6F...`. If so, export or cloud-sync a `.zbak` backup first, uninstall the old preview **for all users**, and install this release once — all future updates on the `A14A...CE11` key update cleanly in-place. Also always update within the same edition with higher `versionCode`, and allow **Install unknown apps** for Chrome / Files.)*

            #### Which APK should I install?
            - **`ZERO-v${{ env.ZERO_VERSION_NAME }}.apk` (Standard Edition — Direct Install):** Clean browser / file-manager install without `BIND_ACCESSIBILITY_SERVICE`. Enforces your Bags via **Usage Access + Display Over Other Apps** watchdog.
            - **`ZERO-requires-adb-v${{ env.ZERO_VERSION_NAME }}.apk` (Strict Accessibility Edition — Full Zero Mode):** Uses Android Accessibility Service to block Notification shade, Quick Settings, Settings, Recents, and unbagged apps. *(On Android 14–16 devices, install via `adb install -r` or Shizuku / "Install with Options", or tap **Open Zero App Info → ⋮ Allow restricted settings**.)*

            #### What's New
            - **Bold Self-Hosted Typography & UI Polish:** Switched to bundled `Bricolage Grotesque Variable`, `Space Grotesk Variable`, and `JetBrains Mono Variable` fonts across all theme engines (`Fluent Glass`, `Aero Porcelain`, `Twilight Dusk`), sharpened interactive controls, and added `:focus-visible` & `prefers-reduced-motion` accessibility support.
            - **Liquid Glass Escape Tickets & Burn the Boats:** Physical tear-off Liquid Glass Escape Tickets earned every **35 cumulative focus hours**, plus optional **Burn the Boats** lockout (up to 4h) for zero-escape sessions.
            - **ZeroTube Distraction-Free Study Feed:** Built-in study player restricted exclusively to your whitelisted channels — zero Shorts, zero recommendations, zero algorithm traps, plus channel guard and study notes.
            - **The Void Redesign & Hourly 10m Pomodoro Break:** Retro 5×7 terminal pixelated clock shaded with your active theme accent (`SYSTEM TIME // SYNCED`), dynamic brand-colored Bag app rows, compulsory **Phone Calls (`ALWAYS ON`)**, and 10-minute hourly breaks with Zen bowl chimes.
            - **3-Theme Engines, Phase 2 Bags & Universal `.zbak` Backups:** Switch between **Fluent Glass**, **Aero Porcelain**, and **Twilight Dusk**; configure unlimited Occasion Bags, per-app daily quotas, Compulsory Study Apps, Action Reminders, and HMAC-SHA256 signed `.zbak` cloud/local backups.
            - **Release Hardening (R8/ProGuard + V1/V2/V3 Signing + Runtime Integrity Guard):** Full R8 shrinking, runtime APK SHA-256 verification, root/emulator tampering guards, and monotonic hardware clock (`SystemClock.elapsedRealtime()`) enforcement.

      - name: Publish Direct Download GitHub Release (Debug-Signed Preview)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ZERO_VERSION_NAME }}
          name: Zero-Noise v${{ env.ZERO_VERSION_NAME }} (code ${{ env.ZERO_VERSION_CODE }})
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          body: |
            ### Zero-Noise (Zero App) v${{ env.ZERO_VERSION_NAME }} (`versionCode ${{ env.ZERO_VERSION_CODE }}`)

            > **Build Signing Note:** These preview APKs use CI debug signing because persistent release signing secrets (`ZERO_KEYSTORE_BASE64`, `ZERO_KEYSTORE_PASS`, `ZERO_KEYSTORE_ALIAS`) are not configured yet in Repository Secrets. Open **Settings & OS → Backup & Restore Everything** before replacing a differently signed build.

            > **Google Play Protect Note ("App scan recommended — Play Protect hasn't seen this app before"):**
            > Because direct GitHub APKs are sideloaded rather than installed from Google Play Store, Android asks to scan new APK binary hashes once before installing. Tap **Scan app** to let Google verify the APK cleanly and proceed.

            #### Which APK should I install?
            - **`ZERO-v${{ env.ZERO_VERSION_NAME }}-preview.apk` (Standard Edition — Direct Install):** Clean sideloading without `BIND_ACCESSIBILITY_SERVICE`, enforcing Bags via **Usage Access + Display Over Other Apps**.
            - **`ZERO-requires-adb-v${{ env.ZERO_VERSION_NAME }}-preview.apk` (Strict Accessibility Edition — Full Zero Mode):** Full Accessibility Service lock blocking Notification shade, Settings, Recents, and unbagged apps (use `adb install -r`, Shizuku, or Allow Restricted Settings on Android 14–16).

            #### What's New
            - **Bold Self-Hosted Typography & UI Polish:** Bundled `Bricolage Grotesque Variable`, `Space Grotesk Variable`, and `JetBrains Mono Variable` fonts across all theme engines (`Fluent Glass`, `Aero Porcelain`, `Twilight Dusk`), sharpened controls, and added `:focus-visible` & `prefers-reduced-motion` accessibility support.
            - **Liquid Glass Escape Tickets & Burn the Boats:** Physical tear-off Liquid Glass Escape Tickets earned every **35 cumulative focus hours**, plus optional **Burn the Boats** lockout (up to 4h).
            - **ZeroTube Distraction-Free Study Feed:** Built-in study player restricted exclusively to your whitelisted channels — zero Shorts, zero recommendations, plus channel guard and study notes.
            - **The Void Redesign & Hourly 10m Pomodoro Break:** Retro 5×7 terminal pixelated clock shaded with your active theme accent (`SYSTEM TIME // SYNCED`), dynamic brand-colored Bag app rows, compulsory **Phone Calls (`ALWAYS ON`)**, and 10-minute hourly breaks.
            - **3-Theme Engines, Phase 2 Bags & Universal `.zbak` Backups:** **Fluent Glass**, **Aero Porcelain**, and **Twilight Dusk** themes, unlimited Occasion Bags, per-app daily quotas, Compulsory Study Apps, Action Reminders, and HMAC-SHA256 signed `.zbak` backups.
            - **Release Hardening (R8/ProGuard + Runtime Integrity Guard):** Full R8 shrinking, runtime APK SHA-256 verification, root/emulator tampering guards, and monotonic hardware clock enforcement.

      - name: Prune Old GitHub Releases (Keep Latest Only)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="v${{ env.ZERO_VERSION_NAME }}"
          echo "Keeping only latest release: $LATEST_TAG"
          OLD_TAGS=$(gh release list --limit 500 --json tagName --jq ".[].tagName | select(. != \"$LATEST_TAG\")")
          for tag in $OLD_TAGS; do
            echo "Deleting old release $tag..."
            gh release delete "$tag" --yes --cleanup-tag || true
          done
